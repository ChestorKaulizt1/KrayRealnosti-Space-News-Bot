name: Space News Collector

on:
workflow_dispatch:
schedule:
- cron: "17 * * * *"

jobs:
collect-news:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Check Python files
    run: |
      python -m py_compile app/main.py
      python -m py_compile app/config.py
      python -m py_compile app/database.py
      python -m py_compile app/rss_parser.py
      python -m py_compile app/article_parser.py
      python -m py_compile app/ai_generator.py
      echo "All Python files are valid"

  - name: Run news collector
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    run: |
      python -m app.main
